<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JSW Tailpipe Emission Calculator</title>

styles.css
script.jsscript>

</head>

<body>

<h1>🚛 Tailpipe Emission Calculator</h1>

<div class="container">

  <h2>Inputs</h2>

  <label>Vehicle Type</label>
  <select id="vehicle">
    <option value="tractor100">4x2 Tractor (100%)</option>
  </select>

  <label>Fleet Size</label>
  <input type="number" id="fleet" value="100">

  <label>Distance Travelled (km)</label>
  <input type="number" id="distance" value="100000">

  <label>OEM Mileage (km/l)</label>
  <input type="number" id="mileage" value="4.5">

  <label>Fuel Energy (kWh/l)</label>
  <input type="number" id="fuelEnergy" value="10">

  <label>Scaling Factor</label>
  <input type="number" id="scaling" value="2.5">

  <label>Fuel Quality</label>
  <select id="quality">
    <option value="1">Standard</option>
    <option value="1.1">Substandard</option>
    <option value="1.25">Adulterated</option>
  </select>

  <label>Congestion Factor</label>
  <input type="number" id="congestion" value="1.38">

  <br><br>
  <button onclick="calculate()">Calculate</button>

</div>

<div class="container">

<h2>Results</h2>

<table id="resultTable">
<tr>
<th>Pollutant</th>
<th>g/km</th>
<th>Total Emission (kg)</th>
</tr>
</table>

<div id="summary"></div>

</div>

</body>
</html>
